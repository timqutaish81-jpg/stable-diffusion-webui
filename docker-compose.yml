version: '3.8'

services:
  # Main Web UI Service
  webui:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sd-webui
    ports:
      - "7860:7860"  # Gradio UI
      - "5000:5000"  # API
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - ./models:/app/models:rw
      - ./embeddings:/app/embeddings:rw
      - ./outputs:/app/outputs:rw
      - ./configs:/app/configs:ro
    restart: unless-stopped
    networks:
      - sd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Development Service with Jupyter
  development:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sd-webui-dev
    ports:
      - "7861:7860"
      - "8888:8888"  # Jupyter
      - "5678:5678"  # Debugpy
    environment:
      - DEBUG=1
      - PYTHONUNBUFFERED=1
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - .:/app
      - ./models:/app/models:rw
      - ./embeddings:/app/embeddings:rw
      - ./outputs:/app/outputs:rw
    networks:
      - sd-network
    profiles:
      - dev
    command: >
      bash -c "
      echo 'Starting Jupyter Lab...' &&
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --NotebookApp.token='' --NotebookApp.password=''
      "

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: sd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sd-network
    command: redis-server --appendonly yes
    profiles:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL for Metadata & Caching
  postgres:
    image: postgres:15-alpine
    container_name: sd-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sdui
      - POSTGRES_PASSWORD=secure_password_change_me
      - POSTGRES_DB=stable_diffusion
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sd-network
    profiles:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdui"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Monitoring Service (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: sd-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - sd-network
    profiles:
      - monitoring

  # Visualization (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: sd-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - sd-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  sd-network:
    driver: bridge
